# Credenciais Postgres
spring:
  datasource:
    url: ${URL_POSTGRES:jdbc:postgresql://localhost:5432/vehicle-dealership}
    username: ${USERNAME_POSTGRES:postgres}
    password: ${PASSWORD_POSTGRES:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

server:
  port: 8080